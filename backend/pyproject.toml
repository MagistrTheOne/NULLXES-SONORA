[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonora"
version = "0.1.0"
description = "NULLXES SONORA — Adaptive Sound Intelligence backend"
requires-python = ">=3.11"
authors = [{ name = "NULLXES" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.28",
    "python-multipart>=0.0.17",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "soundfile>=0.12",
    "openai>=1.55",
    "anthropic>=0.40",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
sonora = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
